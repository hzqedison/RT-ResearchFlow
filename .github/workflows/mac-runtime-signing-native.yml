name: Native Mac locked runtime signing regression

on:
  push:
    branches: [codex/verify-1.7]
    paths:
      - .github/workflows/mac-runtime-signing-native.yml
      - macos/sign-app.cjs
      - macos/electron-builder.cjs
      - tests/node/mac-sign-app.test.cjs
      - tests/native/mac-signing-runtime.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-signing:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - name: Install existing frozen signing dependency without product scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check exclusion contracts without signing or application data
        run: node --test tests/node/mac-sign-app.test.cjs
      - name: Sign owned native fixture and verify unchanged runtime bytes
        run: node tests/native/mac-signing-runtime.cjs
      - name: Export metadata only, not runtime or application payloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-runtime-signing-${{ matrix.arch }}
          path: ${{ runner.temp }}/mac-signing-proof
          if-no-files-found: error
          retention-days: 7
