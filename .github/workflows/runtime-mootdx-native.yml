name: Private runtime dependency feasibility (no installers)

on:
  push:
    branches: [codex/verify-1.7]
    paths:
      - .github/workflows/runtime-mootdx-native.yml
      - scripts/run-mootdx-native-ci.py
      - scripts/build-mootdx-compat-wheel.py
      - scripts/verify-mootdx-compat-runtime.py
      - resources/python-runtime/miniracer_unicode_adapter.py
      - tests/python/test_mootdx_compat_wheel.py
      - tests/fixtures/runtime/mootdx-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mootdx-runtime-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-dependencies:
    if: github.repository == 'hzqedison/RT-ResearchFlow'
    name: mootdx-${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x64
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Assemble and execute real isolated dependencies
        shell: python
        env:
          RT_EXPECTED_ARCH: ${{ matrix.arch }}
          RT_EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          import runpy
          runpy.run_path('scripts/run-mootdx-native-ci.py', run_name='__main__')
      - name: Preserve public native dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: mootdx-native-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ env.RT_MOOTDX_LAB }}/evidence/*
          if-no-files-found: error
          retention-days: 7
