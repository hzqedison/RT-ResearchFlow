name: Merge exact prepared runtime metadata

on:
  push:
    branches: [codex/runtime-merge-1.7]
    paths:
      - .github/workflows/private-runtime-merge.yml
      - scripts/run-private-runtime-merge-ci.cjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  structural-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: '3.13'
      - name: Merge exact candidates without rebuilding providers
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: >-
          node scripts/run-private-runtime-merge-ci.cjs
          --work-root "$RUNNER_TEMP/rt-structural-merge-1.7"
          --python "$MERGE_PYTHON"
      - name: Retain structural lock and real merge bindings only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-runtime-structural-merge
          path: ${{ runner.temp }}/rt-structural-merge-1.7/output
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
