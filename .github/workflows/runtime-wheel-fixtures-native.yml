name: Portable locked wheel fixture contracts

on:
  push:
    branches: [codex/verify-1.7]
    paths:
      - .github/workflows/runtime-wheel-fixtures-native.yml
      - tests/fixtures/runtime-wheel-assets.cjs
      - tests/fixtures/runtime-wheel-assets/**
      - tests/node/runtime-wheel-fixtures.test.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-contracts:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify immutable offline test inputs without product or broker access
        run: node --test tests/node/runtime-wheel-fixtures.test.cjs
