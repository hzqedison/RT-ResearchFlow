name: Formal private runtime native stage

on:
  # This exact ref can start stage before dispatch is registered on main.
  push:
    branches: [codex/runtime-stage-1.7]
  workflow_dispatch:
    inputs:
      formal_inputs_run_id:
        description: Successful run containing the approved formal-lock.json metadata artifact
        required: true
        type: string
      formal_inputs_artifact_id:
        description: Exact artifact ID containing formal-lock.json; no raw input assets
        required: true
        type: string
      prepare_run_id:
        description: Completed successful fullprepare run, not the derived assets run
        required: true
        type: string
      prepare_bindings:
        description: JSON target map with exact artifactId and jobId for each native prepare
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: private-runtime-formal-stage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-stage:
    name: formal-native-stage-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            os: windows-latest
          - target: darwin-arm64
            os: macos-15
          - target: darwin-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      RT_RUNTIME_RELEASE_AUTHORIZATION_REPOSITORY_ID: ${{ vars.RT_RUNTIME_RELEASE_AUTHORIZATION_REPOSITORY_ID }}
      RT_RUNTIME_RELEASE_AUTHORIZATION_COMMIT: ${{ vars.RT_RUNTIME_RELEASE_AUTHORIZATION_COMMIT }}
      RT_RUNTIME_RELEASE_AUTHORIZATION_PATH: ${{ vars.RT_RUNTIME_RELEASE_AUTHORIZATION_PATH }}
      RT_RUNTIME_RELEASE_AUTHORIZATION_SHA256: ${{ vars.RT_RUNTIME_RELEASE_AUTHORIZATION_SHA256 }}
      NODE_OPTIONS: ''
      NODE_PATH: ''
      FORMAL_INPUTS_RUN_ID: ${{ inputs.formal_inputs_run_id || vars.RT_RUNTIME_STAGE_FORMAL_INPUTS_RUN_ID }}
      FORMAL_INPUTS_ARTIFACT_ID: ${{ inputs.formal_inputs_artifact_id || vars.RT_RUNTIME_STAGE_FORMAL_INPUTS_ARTIFACT_ID }}
      PREPARE_RUN_ID: ${{ inputs.prepare_run_id || vars.RT_RUNTIME_STAGE_PREPARE_RUN_ID }}
      PREPARE_BINDINGS: ${{ inputs.prepare_bindings || vars.RT_RUNTIME_STAGE_PREPARE_BINDINGS }}
    steps:
      - name: Require the existing protected authorization pins
        uses: actions/github-script@v7
        with:
          script: |
            if (process.env.RUNNER_ENVIRONMENT !== 'github-hosted') throw new Error('Hosted runner required');
            const e = process.env;
            if (!/^[1-9][0-9]*$/.test(e.RT_RUNTIME_RELEASE_AUTHORIZATION_REPOSITORY_ID || '') ||
                !/^[a-f0-9]{40}$/.test(e.RT_RUNTIME_RELEASE_AUTHORIZATION_COMMIT || '') ||
                !/^[a-f0-9]{64}$/.test(e.RT_RUNTIME_RELEASE_AUTHORIZATION_SHA256 || '') ||
                !e.RT_RUNTIME_RELEASE_AUTHORIZATION_PATH) throw new Error('Existing protected authorization pins are missing');
            if (![e.FORMAL_INPUTS_RUN_ID,e.FORMAL_INPUTS_ARTIFACT_ID].every(v => /^[1-9][0-9]*$/.test(v) && Number.isSafeInteger(Number(v)))) throw new Error('Exact formal input identities required');
            if (!/^[1-9][0-9]*$/.test(e.PREPARE_RUN_ID || '') || !Number.isSafeInteger(Number(e.PREPARE_RUN_ID))) throw new Error('Exact fullprepare run required');
            const bindings = JSON.parse(e.PREPARE_BINDINGS || '{}');
            const targets = ['win32-x64','darwin-arm64','darwin-x64'];
            if (!bindings || Array.isArray(bindings) || Object.keys(bindings).sort().join(',') !== [...targets].sort().join(',')) throw new Error('Three exact prepare bindings required');
            for (const target of targets) {
              const binding = bindings[target];
              if (!binding || Array.isArray(binding) || Object.keys(binding).sort().join(',') !== 'artifactId,jobId' ||
                  ![binding.artifactId,binding.jobId].every(v => Number.isSafeInteger(v) && v > 0)) throw new Error('Invalid prepare binding');
            }
            const pinned = {
              'win32-x64': {artifactId:11616690014,jobId:113819981301},
              'darwin-arm64': {artifactId:11616007217,jobId:113819981587},
              'darwin-x64': {artifactId:11615829391,jobId:113819981483},
            };
            if (Number(e.PREPARE_RUN_ID) !== 37930575544 ||
                targets.some(t => bindings[t].artifactId !== pinned[t].artifactId || bindings[t].jobId !== pinned[t].jobId)) throw new Error('Final prepare pins mismatch');
            if (new Set(targets.map(t => bindings[t].artifactId)).size !== 3 ||
                new Set(targets.map(t => bindings[t].jobId)).size !== 3) throw new Error('Duplicate prepare identities');
            const run = (await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(e.FORMAL_INPUTS_RUN_ID)})).data;
            const artifact = (await github.rest.actions.getArtifact({...context.repo,artifact_id:Number(e.FORMAL_INPUTS_ARTIFACT_ID)})).data;
            if (run.status !== 'completed' || run.conclusion !== 'success' ||
                run.repository.id !== context.payload.repository.id || run.head_repository.id !== run.repository.id ||
                artifact.expired || artifact.workflow_run.id !== run.id || artifact.workflow_run.head_sha !== run.head_sha) throw new Error('Formal input artifact origin rejected');
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: '3.13'
      - name: Download the exact successful prepared candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PREPARE_RUN_ID }}
          artifact-ids: ${{ fromJSON(env.PREPARE_BINDINGS)[matrix.target].artifactId }}
          merge-multiple: true
          path: ${{ runner.temp }}/rt-stage-candidate
      - name: Download the approved formal lock metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FORMAL_INPUTS_RUN_ID }}
          artifact-ids: ${{ env.FORMAL_INPUTS_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/rt-stage-formal-inputs
      - name: Reuse native derived wheel bytes without C rebuilding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37927640327
          name: lxml-redistribution-${{ matrix.target }}
          path: ${{ runner.temp }}/rt-stage-derived
      - name: Construct existing stage inputs and run the formal native producer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RT_TARGET: ${{ matrix.target }}
          STAGE_PYTHON: ${{ steps.python.outputs.python-path }}
          PREPARE_ARTIFACT_ID: ${{ fromJSON(env.PREPARE_BINDINGS)[matrix.target].artifactId }}
          PREPARE_JOB_ID: ${{ fromJSON(env.PREPARE_BINDINGS)[matrix.target].jobId }}
        run: |
          set -euo pipefail
          node scripts/run-private-runtime-stage-ci.cjs \
            --target "$RT_TARGET" \
            --candidate-proof "$RUNNER_TEMP/rt-stage-candidate" \
            --formal-lock "$RUNNER_TEMP/rt-stage-formal-inputs/formal-lock.json" \
            --derived-cache "$RUNNER_TEMP/rt-stage-derived" \
            --work-root "$RUNNER_TEMP/rt-formal-stage-$RT_TARGET" \
            --python "$STAGE_PYTHON" \
            --prepare-run "$PREPARE_RUN_ID" \
            --prepare-artifact "$PREPARE_ARTIFACT_ID" \
            --prepare-job "$PREPARE_JOB_ID"
      - name: Preserve exact native report and stage input metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-runtime-native-stage-${{ matrix.target }}
          path: ${{ runner.temp }}/rt-formal-stage-${{ matrix.target }}/evidence
          if-no-files-found: error
          retention-days: 30
