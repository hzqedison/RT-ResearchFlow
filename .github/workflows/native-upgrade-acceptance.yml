name: Mac published native upgrade acceptance (1.0 to 1.1; Windows held)

on:
  push:
    branches: [codex/acceptance-1.0-to-1.1]
    paths:
      - .github/workflows/native-upgrade-acceptance.yml
      - .github/scripts/fetch-upgrade-installers.cjs
      - tests/fixtures/releases/native-upgrade-1.0-1.1.json
      - tools/native-acceptance/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-upgrade-acceptance-1.0-to-1.1
  cancel-in-progress: false

env:
  # Applied to checkout's Git subprocesses before any working-tree files exist.
  # Do not normalize files after checkout to manufacture a passing digest.
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.eol
  GIT_CONFIG_VALUE_1: lf
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  DEBUG: ''
  PWDEBUG: ''

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      manifest_sha256: ${{ steps.inputs.outputs.manifest_sha256 }}
      combined_sha256: ${{ steps.inputs.outputs.combined_sha256 }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
      - name: Validate frozen published inputs (no native download)
        id: inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/native-acceptance/evidence.mjs prepare

  native:
    needs: prepare
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macOS
            arch: arm64
          - runner: macos-15-intel
            platform: macOS
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          architecture: ${{ matrix.arch }}
      - name: Create owned hosted-native case (private progress, no placeholder artifact)
        id: initialize
        run: node tools/native-acceptance/evidence.mjs init ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Verify all 17 raw files against freeze and this exact source commit
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NA_EXPECTED_COMBINED_SHA256: ${{ needs.prepare.outputs.combined_sha256 }}
        run: node tools/native-acceptance/evidence.mjs verify
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.14.0
          run_install: false
          package_json_file: tools/native-acceptance/package.json
      - name: Install only the standalone harness (no product scripts or browsers)
        working-directory: tools/native-acceptance
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-workspace
      - name: Fetch both immutable published installers with hash and size verification
        timeout-minutes: 11
        run: node tools/native-acceptance/evidence.mjs fetch
      - name: Four independent launches across real native upgrade and Keychain persistence
        timeout-minutes: 12
        working-directory: tools/native-acceptance
        run: node evidence.mjs run
      - name: Always restore owned network and temporary Keychain state
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        timeout-minutes: 2
        run: node tools/native-acceptance/evidence.mjs cleanup
      - name: Stage only scanned whitelisted evidence
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        run: node tools/native-acceptance/evidence.mjs publish
      - name: Upload sanitized evidence, never profiles or test-runner attachments
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: native-acceptance-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.NA_PUBLIC_EVIDENCE }}/input-manifest.json
            ${{ env.NA_PUBLIC_EVIDENCE }}/acceptance-result.json
            ${{ env.NA_PUBLIC_EVIDENCE }}/network-isolation.json
            ${{ env.NA_PUBLIC_EVIDENCE }}/installer-events.json

  collect:
    if: ${{ always() }}
    needs: [prepare, native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: native-acceptance-*-${{ github.run_id }}-*
          path: ${{ runner.temp }}/native-acceptance-collection
      - name: Require both Mac results; Windows remains outside this acceptance run
        env:
          NA_NATIVE_RESULT: ${{ needs.native.result }}
        run: node tools/native-acceptance/evidence.mjs collect-mac "${{ runner.temp }}/native-acceptance-collection"
