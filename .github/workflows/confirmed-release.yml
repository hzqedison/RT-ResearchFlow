name: Deliver confirmed 1.0 installers

on:
  push:
    branches: [codex/release-1.0]
    paths: [.github/workflows/confirmed-release.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: confirmed-release-1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: hzqedison/RT-ResearchFlow
      FROZEN_SOURCE: 41f8429149f646c7dec7f1610082702e7d9cce48
    steps:
      - name: Verify successful builds and reuse their tested installers
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import shutil
          import subprocess
          import zipfile

          repo = os.environ["GH_REPO"]
          source = os.environ["FROZEN_SOURCE"]
          mac_head = "d0843f9870a3d61cb512901e06d6da90c43a7240"
          mac_workflow_blob = "d431de8eeb09c1e21a0d2b0f81220a7c26c06830"

          def api(endpoint):
              result = subprocess.run(["gh", "api", "repos/" + repo + "/" + endpoint],
                                      check=True, capture_output=True, text=True)
              return json.loads(result.stdout)

          releases = json.loads(subprocess.run(
              ["gh", "api", "--paginate", "--slurp", "repos/" + repo + "/releases?per_page=100"],
              check=True, capture_output=True, text=True).stdout)
          existing = [r for page in releases for r in page if r["tag_name"] == "v1.0.0"]
          if existing:
              if not (len(existing) == 1 and existing[0]["id"] == 406014888 and
                      existing[0]["draft"] and existing[0]["target_commitish"] == source):
                  raise RuntimeError("Existing release is not our verified recovery draft; refusing modification")
              pathlib.Path("existing-release.json").write_text(json.dumps(existing[0]))

          windows_run = api("actions/runs/37653940356")
          if not (windows_run["head_sha"] == source and
                  windows_run["status"] == "completed" and windows_run["conclusion"] == "success"):
              raise RuntimeError("Windows build has not succeeded for the frozen application source")
          windows_jobs = api("actions/runs/37653940356/jobs")["jobs"]
          if not windows_jobs or any(j["conclusion"] != "success" for j in windows_jobs):
              raise RuntimeError("Windows build or installed-application check job did not succeed")

          mac_run = api("actions/runs/37659004838")
          if mac_run["head_sha"] != mac_head or mac_run["status"] != "completed":
              raise RuntimeError("Mac build run source mismatch")
          original_workflow = api("contents/.github/workflows/confirmed-release.yml?ref=" + mac_head)
          if original_workflow["sha"] != mac_workflow_blob:
              raise RuntimeError("Mac workflow differs from the reviewed frozen-source build definition")
          for job_id, expected_name in [
              (112921398024, "macos-build (macos-15-intel, x64)"),
              (112921398538, "macos-build (macos-15, arm64)"),
          ]:
              job = api("actions/jobs/" + str(job_id))
              if not (job["run_id"] == mac_run["id"] and job["head_sha"] == mac_head and
                      job["name"] == expected_name and job["status"] == "completed" and
                      job["conclusion"] == "success"):
                  raise RuntimeError("Mac build job did not succeed for the reviewed source")
              required_steps = {
                  "Verify source and safe upstream merging",
                  "Install from DMG and test the installed application",
                  "Upload tested packages",
              }
              successful_steps = {s["name"] for s in job["steps"] if s["conclusion"] == "success"}
              if not required_steps.issubset(successful_steps):
                  raise RuntimeError("Mac source, installed-application or upload check is incomplete")

          specs = [
              (11497932890, 37653940356, source,
               "RT-ResearchFlow-Windows-x64-" + source,
               "RT-ResearchFlow-Setup-1.0.0-x64.exe",
               "sha256:327f3ad43a8337023cbf6da38d88be5354a63b2d9eb0dfa40511a2c5c262ff5c"),
              (11499968594, 37659004838, mac_head,
               "confirmed-1.0-macOS-arm64-" + mac_head,
               "RT-ResearchFlow-macOS-1.0.0-arm64.dmg",
               "sha256:91a98a179ee4fc1a055285d762174970e31b4d5cd26c0297a4822632a6e2dd7f"),
              (11501650076, 37659004838, mac_head,
               "confirmed-1.0-macOS-x64-" + mac_head,
               "RT-ResearchFlow-macOS-1.0.0-x64.dmg",
               "sha256:92f8e686457fcec14f528bf6810e06e73f05bd9aa04d7ed0b8f98660b63d88e0"),
          ]
          assets = pathlib.Path("assets")
          assets.mkdir(exist_ok=False)
          archives = pathlib.Path("archives")
          archives.mkdir(exist_ok=False)
          evidence = {"sourceSha": source, "windowsRun": windows_run["id"],
                      "macRun": mac_run["id"], "macWorkflowCommit": mac_head, "assets": []}

          def digest_stream(stream):
              digest = hashlib.sha256()
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
              return digest.hexdigest()

          for artifact_id, run_id, head, expected_name, installer, pinned_digest in specs:
              artifact = api("actions/artifacts/" + str(artifact_id))
              if not (artifact["id"] == artifact_id and not artifact["expired"] and
                      artifact["name"] == expected_name and
                      artifact["workflow_run"]["id"] == run_id and
                      artifact["workflow_run"]["head_sha"] == head and
                      artifact.get("digest") == pinned_digest):
                  raise RuntimeError("Artifact identity, source or archive digest mismatch")
              archive = archives / (str(artifact_id) + ".zip")
              with archive.open("wb") as output:
                  subprocess.run(["gh", "api", "repos/" + repo + "/actions/artifacts/" +
                                  str(artifact_id) + "/zip"], check=True, stdout=output)
              with archive.open("rb") as stream:
                  if "sha256:" + digest_stream(stream) != pinned_digest:
                      raise RuntimeError("Downloaded artifact ZIP does not match its pinned digest")

              with zipfile.ZipFile(archive) as package:
                  members = {}
                  for entry in package.infolist():
                      if entry.is_dir():
                          continue
                      path = pathlib.PurePosixPath(entry.filename)
                      if path.is_absolute() or ".." in path.parts or "\\" in entry.filename:
                          raise RuntimeError("Unsafe artifact member path")
                      if path.name in members:
                          raise RuntimeError("Ambiguous artifact basenames")
                      members[path.name] = entry
                  manifest = members.get("SHA256SUMS.txt")
                  if manifest is None:
                      raise RuntimeError("Build checksum manifest is missing")
                  hashes = {}
                  for line in package.read(manifest).decode("utf-8-sig").splitlines():
                      if not line.strip():
                          continue
                      match = re.fullmatch(r"([0-9a-fA-F]{64})[ \t]+\*?(.+)", line)
                      if match is None:
                          raise RuntimeError("Malformed build checksum entry")
                      checksum, original_path = match.groups()
                      path = pathlib.PurePosixPath(original_path)
                      if path.is_absolute() or ".." in path.parts or "\\" in original_path:
                          raise RuntimeError("Unsafe build checksum path")
                      # Build manifests can retain release/, while uploaded artifacts are flat.
                      if tuple(path.parts) not in [(path.name,), ("release", path.name)]:
                          raise RuntimeError("Unexpected build checksum directory")
                      if path.name in hashes or path.name not in members:
                          raise RuntimeError("Duplicate or missing checksum target")
                      hashes[path.name] = checksum.lower()
                  if set(hashes) != set(members) - {"SHA256SUMS.txt"} or installer not in hashes:
                      raise RuntimeError("Checksum manifest does not cover the complete build payload")
                  for name, expected_hash in hashes.items():
                      with package.open(members[name]) as stream:
                          if digest_stream(stream) != expected_hash:
                              raise RuntimeError("Build payload checksum mismatch: " + name)
                  target = assets / installer
                  with package.open(members[installer]) as stream, target.open("xb") as output:
                      shutil.copyfileobj(stream, output)
                  with target.open("rb") as stream:
                      actual_hash = digest_stream(stream)
                  if actual_hash != hashes[installer]:
                      raise RuntimeError("Prepared installer checksum mismatch")
                  evidence["assets"].append({"name": installer, "size": target.stat().st_size,
                                             "sha256": actual_hash, "artifactId": artifact_id})
                  print("Verified " + installer + " SHA256=" + actual_hash)

          with (assets / "SHA256SUMS.txt").open("x", encoding="utf-8") as manifest:
              for item in evidence["assets"]:
                  manifest.write(item["sha256"] + "  " + item["name"] + "\n")
          pathlib.Path("release-evidence.json").write_text(json.dumps(evidence, indent=2) + "\n")
          PY
      - name: Publish confirmed 1.0 testing release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          # RT-ResearchFlow 1.0

          资讯监控、研报检索、多数据源行情、AI 分析、策略验证、复盘与本人确认的交易功能，集成在同一个产品中。

          ## 直接安装
          - Windows：下载 RT-ResearchFlow-Setup-1.0.0-x64.exe。
          - Apple 芯片 Mac：下载 RT-ResearchFlow-macOS-1.0.0-arm64.dmg。
          - Intel Mac：下载 RT-ResearchFlow-macOS-1.0.0-x64.dmg。
          - SHA256SUMS.txt 提供三个安装包的校验值，无需先解压 ZIP。

          ## 版本与检查范围
          本次交付此前已确认的 1.0，应用源码固定于 41f8429149f646c7dec7f1610082702e7d9cce48。
          Windows 安装后检查及两种 Mac 的 DMG 安装、启动和隔离检查均已通过。发布流程复用这些已测试产物，并核对原始产物及安装包 SHA256。
          后续开发分支中的应用内更新器和免 Key 官方交易日历改动尚未包含，将随下一次版本迭代交付。
          交易功能通过 Mac 本机同花顺桥接，订单需本人确认；她的同花顺版本和中信账户仍需本人本机测试。构建检查未连接券商、未提交真实订单，Windows 同花顺实盘执行及无人值守交易尚未验证。
          Mac 安装包采用临时签名，尚未完成 Apple Developer ID 签名及公证。
          安装包为完整安装包。本次未实现增量更新。请保留个人数据库备份，反馈时勿发送账户、密码、API Key 或个人交易数据。

          [Windows 安装检查](https://github.com/hzqedison/RT-ResearchFlow/actions/runs/37653940356)
          [两种 Mac 构建与安装检查](https://github.com/hzqedison/RT-ResearchFlow/actions/runs/37659004838)
          [对应应用源码](https://github.com/hzqedison/RT-ResearchFlow/tree/41f8429149f646c7dec7f1610082702e7d9cce48)

          <!-- tested-source:41f8429149f646c7dec7f1610082702e7d9cce48 publisher-schema:2 -->
          NOTES
          if [ ! -f existing-release.json ]; then
          gh release create v1.0.0 \
            assets/RT-ResearchFlow-Setup-1.0.0-x64.exe \
            assets/RT-ResearchFlow-macOS-1.0.0-arm64.dmg \
            assets/RT-ResearchFlow-macOS-1.0.0-x64.dmg \
            assets/SHA256SUMS.txt \
            --target "$FROZEN_SOURCE" \
            --title 'RT-ResearchFlow 1.0' \
            --draft \
            --prerelease \
            --notes-file release-notes.md
          fi
          python3 <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          repo = os.environ["GH_REPO"]
          def api(endpoint):
              return json.loads(subprocess.run(
                  ["gh", "api", "repos/" + repo + "/" + endpoint],
                  check=True, capture_output=True, text=True).stdout)

          pages = json.loads(subprocess.run(
              ["gh", "api", "--paginate", "--slurp", "repos/" + repo + "/releases?per_page=100"],
              check=True, capture_output=True, text=True).stdout)
          candidates = [r for page in pages for r in page if r["tag_name"] == "v1.0.0"]
          if len(candidates) != 1:
              raise RuntimeError("Cannot identify the single release draft")
          release = api("releases/" + str(candidates[0]["id"]))
          if not (release["target_commitish"] == os.environ["FROZEN_SOURCE"] and
                  release["draft"] and release["prerelease"]):
              raise RuntimeError("Draft release source or testing status mismatch")
          expected = {p.name: {"size": p.stat().st_size,
                      "digest": "sha256:" + hashlib.sha256(p.read_bytes()).hexdigest()}
                      for p in pathlib.Path("assets").iterdir()}
          uploaded = {a["name"]: a for a in release["assets"]}
          if set(uploaded) != set(expected):
              raise RuntimeError("Draft release asset set is incomplete or unexpected")
          for name, item in expected.items():
              remote = uploaded[name]
              if remote["size"] != item["size"] or remote["digest"] != item["digest"] or remote["state"] != "uploaded":
                  raise RuntimeError("Uploaded release asset integrity mismatch: " + name)
          pathlib.Path("published-assets.json").write_text(json.dumps(release, indent=2) + "\n")
          PY
          release_id="$(python3 -c 'import json; print(json.load(open("published-assets.json"))["id"])')"
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false > public-release.json
          gh api "repos/$GH_REPO/releases/tags/v1.0.0" --jq '.assets[] | [.name, .browser_download_url, .size, .digest] | @tsv' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve publication integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confirmed-1.0-publication-evidence
          path: |
            release-evidence.json
            published-assets.json
          if-no-files-found: ignore
          retention-days: 30
