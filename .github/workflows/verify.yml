name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'

      - name: Check public boundary
        shell: pwsh
        run: ./.github/scripts/Test-PublicBoundary.ps1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up native Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        env:
          DATA_SOURCE_NATIVE_PYTHON: ${{ steps.python.outputs.python-path }}
          DATA_SOURCE_NATIVE_PYTHON_VERSION: '3.13'
          DATA_SOURCE_NATIVE_ARCH: x64
        run: pnpm run verify
