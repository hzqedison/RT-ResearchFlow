name: Fetch pinned Mac dependency source materials

on:
  push:
    branches: [codex/verify-mac-1.7]
    paths:
      - .github/workflows/lxml-mac-source-materials.yml
      - scripts/fetch-lxml-mac-source-materials-ci.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-source-materials-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source-materials:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Download exact public sources without compilation
        timeout-minutes: 6
        run: >-
          python -X utf8 -B -I scripts/fetch-lxml-mac-source-materials-ci.py
          --output-dir "$RUNNER_TEMP/lxml-mac-public-materials"
      - name: Preserve only complete SHA-verified materials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lxml-mac-public-materials
          path: ${{ runner.temp }}/lxml-mac-public-materials
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
