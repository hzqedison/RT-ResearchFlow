name: Public on-demand Windows and Mac packages
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        default: '1.13.0'
      target:
        type: choice
        options: [all, windows, macos, installer, probe, trace]
        default: all
      tested_windows_run:
        type: string
        default: '38151418862'
      tested_windows_commit:
        type: string
        default: '066d0299cae99c5b4709a5705376fa87373b7f9b'
permissions:
  contents: read
concurrency:
  group: public-on-demand-macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'hzqedison/RT-ResearchFlow' && inputs.target != 'windows' && inputs.target != 'installer' && inputs.target != 'probe' && inputs.target != 'trace'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RT_EXTENSION_DELIVERY: on-demand
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      USE_HARD_LINKS: 'false'
      NODE_OPTIONS: ''
      NODE_PATH: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Install native dependencies
        run: |
          node -e "if(require('./package.json').version !== '${{ inputs.version }}')throw Error('Requested version differs from source')"
          test "$(node -p 'require("./package.json").version')" = '${{ inputs.version }}'
          test "$(node -p process.arch)" = '${{ matrix.arch }}'
          pnpm install --frozen-lockfile --config.side-effects-cache=false
      - name: Type checks and extension contracts
        run: |
          pnpm run typecheck
          node --test scripts/packaged-ai-credential-proof.test.cjs
          pnpm exec cross-env ELECTRON_RUN_AS_NODE=1 electron node_modules/vitest/vitest.mjs run tests/unit/aiConfigStorage.test.ts --maxWorkers=1 --minWorkers=1
          pnpm exec cross-env ELECTRON_RUN_AS_NODE=1 electron node_modules/vitest/vitest.mjs run tests/unit/strategyLab.publicLimitUp.test.tsx tests/unit/strategyLab.service.test.ts tests/unit/strategyLab.conditionSnapshotRun.test.ts tests/unit/tushareCredentialVerification.test.tsx tests/unit/publicLimitUpRules.test.tsx tests/unit/nativePublicLimitPool.test.ts tests/unit/verifiedPublicLimitPoolCache.test.ts tests/unit/currentPublicConceptLookup.service.test.ts tests/unit/currentPublicConceptLookup.wiring.test.ts --maxWorkers=1 --minWorkers=1
          pnpm exec vitest run tests/unit/onDemandDataExtensions.test.ts tests/unit/pythonSourceRequirements.test.ts tests/unit/dataExtensionDelivery.test.ts tests/unit/productPythonRuntime.test.ts tests/unit/productPythonDownloads.test.ts tests/unit/macProductPythonRuntime.test.ts tests/unit/decisionDateCaption.test.ts
      - name: Build same-product native installer
        run: node macos/build.mjs
      - name: Actual DMG install, startup and first-use online extension test
        shell: bash
        env:
          RT_ONDEMAND_PYTHON: /missing-system-python-for-private-runtime-acceptance
          RT_ONDEMAND_ALLOW_NETWORK: '1'
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/public-dmg"
          install="$RUNNER_TEMP/public-installed"
          mkdir -p "$mount" "$install"
          dmg="$(find release -maxdepth 1 -name '*-${{ matrix.arch }}.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" || true' EXIT
          ditto "$mount/RT-ResearchFlow.app" "$install/RT-ResearchFlow.app"
          hdiutil detach "$mount"
          trap - EXIT
          codesign --verify --deep --strict "$install/RT-ResearchFlow.app"
          export RT_PACKAGED_EXE="$install/RT-ResearchFlow.app/Contents/MacOS/RT-ResearchFlow"
          export RT_PACKAGED_VERSION="$(node -p 'require("./package.json").version')"
          export RT_PACKAGED_TEST_ROOT="$RUNNER_TEMP/public-acceptance"
          node scripts/mac-packaged-acceptance.cjs "$RT_PACKAGED_EXE"
          pnpm exec playwright test tests/e2e/on-demand-extensions.spec.ts --workers=1 --retries=0 --reporter=line
          node scripts/verify-packaged-ai-credentials.cjs "$RT_PACKAGED_EXE"
          shasum -a 256 release/*.dmg > release/SHA256SUMS-${{ matrix.arch }}.txt
          node scripts/write-public-package-receipt.cjs
      - name: Upload only tested direct installers
        uses: actions/upload-artifact@v4
        with:
          name: public-mac-${{ matrix.arch }}-${{ github.sha }}
          path: |
            release/*.dmg
            release/SHA256SUMS-${{ matrix.arch }}.txt
            release/SHA256SUMS-darwin-${{ matrix.arch }}.txt
            release/acceptance-darwin-${{ matrix.arch }}.json
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-mac-evidence-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: ignore
  windows:
    if: github.repository == 'hzqedison/RT-ResearchFlow' && inputs.target != 'macos' && inputs.target != 'installer' && inputs.target != 'probe'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RT_EXTENSION_DELIVERY: on-demand
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      USE_HARD_LINKS: 'false'
      NODE_OPTIONS: ''
      NODE_PATH: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.13'
      - name: Isolate application and build caches on D drive
        shell: pwsh
        run: |
          $root = 'D:\rt-public-' + $env:GITHUB_RUN_ID
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          "TEMP=$root" | Add-Content $env:GITHUB_ENV
          "TMP=$root" | Add-Content $env:GITHUB_ENV
          "ELECTRON_CACHE=$root\electron-cache" | Add-Content $env:GITHUB_ENV
          "ELECTRON_BUILDER_CACHE=$root\builder-cache" | Add-Content $env:GITHUB_ENV
      - name: Install native dependencies and check source
        run: |
          node -e "if(require('./package.json').version !== '${{ inputs.version }}')throw Error('Requested version differs from source')"
          pnpm install --frozen-lockfile --config.side-effects-cache=false
          pnpm run typecheck
          node --test scripts/packaged-ai-credential-proof.test.cjs
          pnpm exec cross-env ELECTRON_RUN_AS_NODE=1 electron node_modules/vitest/vitest.mjs run tests/unit/aiConfigStorage.test.ts --maxWorkers=1 --minWorkers=1
          pnpm exec cross-env ELECTRON_RUN_AS_NODE=1 electron node_modules/vitest/vitest.mjs run tests/unit/strategyLab.publicLimitUp.test.tsx tests/unit/strategyLab.service.test.ts tests/unit/strategyLab.conditionSnapshotRun.test.ts tests/unit/tushareCredentialVerification.test.tsx tests/unit/publicLimitUpRules.test.tsx tests/unit/nativePublicLimitPool.test.ts tests/unit/verifiedPublicLimitPoolCache.test.ts tests/unit/currentPublicConceptLookup.service.test.ts tests/unit/currentPublicConceptLookup.wiring.test.ts --maxWorkers=1 --minWorkers=1
          pnpm exec vitest run tests/unit/onDemandDataExtensions.test.ts tests/unit/pythonSourceRequirements.test.ts tests/unit/dataExtensionDelivery.test.ts tests/unit/productPythonRuntime.test.ts tests/unit/productPythonDownloads.test.ts tests/unit/macProductPythonRuntime.test.ts tests/unit/decisionDateCaption.test.ts
          pnpm run build
      - name: Build the actual Windows installer
        if: inputs.target != 'trace'
        run: pnpm exec electron-builder --win --x64 --config electron-builder.js --config.nsis.runAfterFinish=false --publish never
      - name: Build an unpublishable full-installer diagnostic
        if: inputs.target == 'trace'
        run: |
          node scripts/trace-full-nsis.cjs
          pnpm exec electron-builder --win --x64 --config electron-builder.js --config.nsis.runAfterFinish=false --publish never
      - name: Verify packaged runtime and first-use private extension
        shell: pwsh
        env:
          RT_ONDEMAND_PYTHON: ${{ steps.python.outputs.python-path }}
          RT_ONDEMAND_ALLOW_NETWORK: '1'
        run: |
          $env:RT_PACKAGED_EXE = (Resolve-Path 'release/win-unpacked/RT-ResearchFlow.exe').Path
          $env:RT_PACKAGED_VERSION = '${{ inputs.version }}'
          $env:RT_PACKAGED_TEST_ROOT = Join-Path $env:TEMP 'acceptance'
          node scripts/verify-packaged-runtime.cjs $env:RT_PACKAGED_EXE
          if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime acceptance failed' }
          pnpm exec playwright test tests/e2e/packaged-startup.spec.ts tests/e2e/on-demand-extensions.spec.ts --workers=1 --retries=0 --reporter=line
          if ($LASTEXITCODE -ne 0) { throw 'Packaged GUI or private extension acceptance failed' }
          node scripts/verify-packaged-ai-credentials.cjs $env:RT_PACKAGED_EXE
          if ($LASTEXITCODE -ne 0) { throw 'Packaged credential persistence acceptance failed' }
      - name: Install the exact NSIS package and verify installed startup
        shell: pwsh
        run: |
          $installer = (Resolve-Path 'release/RT-ResearchFlow-Setup-${{ inputs.version }}-x64.exe').Path
          $install = Join-Path $env:TEMP 'installed-product'
          $started = Get-Date
          $p = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$install") -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path -LiteralPath "$env:TEMP\rt-native-installer.log") { Get-Content -LiteralPath "$env:TEMP\rt-native-installer.log" }
            Start-Sleep -Seconds 5
            $faults = @(Get-WinEvent -FilterHashtable @{LogName='Application';Id=1000;StartTime=$started} -ErrorAction SilentlyContinue | ForEach-Object {
              $xml = [xml]$_.ToXml()
              $data = @{}
              foreach ($entry in $xml.Event.EventData.Data) {
                if ($entry.Name -in @('AppName','AppVersion','ModuleName','ModuleVersion','ExceptionCode','FaultingOffset')) { $data[$entry.Name] = $entry.'#text' }
              }
              $data
            })
            @{exitCode=$p.ExitCode;sourceCommit=$env:GITHUB_SHA;faults=$faults;accepted=$false} | ConvertTo-Json -Depth 5 | Tee-Object -FilePath 'release/nsis-diagnostic.json'
            throw "NSIS failed: $($p.ExitCode)"
          }
          $env:RT_PACKAGED_EXE = Join-Path $install 'RT-ResearchFlow.exe'
          $env:RT_PACKAGED_VERSION = '${{ inputs.version }}'
          $env:RT_PACKAGED_ALLOW_EXISTING_DATA = '1'
          $env:RT_PACKAGED_TEST_ROOT = Join-Path $env:TEMP 'installed-acceptance'
          pnpm exec playwright test tests/e2e/packaged-startup.spec.ts --workers=1 --retries=0 --reporter=line
          if ($LASTEXITCODE -ne 0) { throw 'Installed package startup failed' }
          node scripts/write-public-package-receipt.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Package receipt failed' }
      - name: Upload tested direct Windows installer
        if: inputs.target != 'trace'
        uses: actions/upload-artifact@v4
        with:
          name: public-windows-x64-${{ github.sha }}
          path: |
            release/RT-ResearchFlow-Setup-${{ inputs.version }}-x64.exe
            release/SHA256SUMS-win32-x64.txt
            release/acceptance-win32-x64.json
          if-no-files-found: error
      - name: Preserve failed installer for diagnosis only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unaccepted-windows-diagnostic-${{ github.sha }}
          path: |
            release/RT-ResearchFlow-Setup-${{ inputs.version }}-x64.exe
            release/nsis-diagnostic.json
          if-no-files-found: warn
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-windows-evidence-x64-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
  installer_lifecycle:
    if: github.repository == 'hzqedison/RT-ResearchFlow' && inputs.target == 'installer'
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          repository: hzqedison/RT-ResearchFlow
          run-id: ${{ inputs.tested_windows_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: public-windows-x64-${{ inputs.tested_windows_commit }}
          path: tested-installer
      - name: Test default path, same-directory upgrade and data-preserving uninstall
        shell: pwsh
        env:
          SHARED_PYTHON: ${{ steps.python.outputs.python-path }}
          TESTED_WINDOWS_COMMIT: ${{ inputs.tested_windows_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEMP = 'D:\rt-lifecycle-' + $env:GITHUB_RUN_ID
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Path $env:TEMP | Out-Null
          $target = 'D:\Program Files\RT-ResearchFlow'
          if (Test-Path -LiteralPath $target) { throw 'Fresh fixture target already exists' }
          $installer = (Resolve-Path 'tested-installer/RT-ResearchFlow-Setup-${{ inputs.version }}-x64.exe').Path
          $receipt = Get-Content -Raw 'tested-installer/acceptance-win32-x64.json' | ConvertFrom-Json
          $sha = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($receipt.version -ne '${{ inputs.version }}' -or $receipt.sourceCommit -ne $env:TESTED_WINDOWS_COMMIT -or $receipt.sha256 -ne $sha) { throw 'Tested installer identity mismatch' }
          $sharedHash = (Get-FileHash -LiteralPath $env:SHARED_PYTHON -Algorithm SHA256).Hash
          $p = Start-Process -FilePath $installer -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Default NSIS install failed: $($p.ExitCode)" }
          $exe = Join-Path $target 'RT-ResearchFlow.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Default installation did not use D Program Files' }
          $data = Join-Path $target 'data'
          $fixtures = @('runtime\python\retention-fixture.txt','data-source-extensions\fixture\retention-fixture.txt','data-source-cache\pip\retention-fixture.txt','preferences-fixture.json')
          $before = @{}
          foreach ($relative in $fixtures) {
            $file = Join-Path $data $relative
            New-Item -ItemType Directory -Path (Split-Path -Parent $file) -Force | Out-Null
            'isolated synthetic retention fixture; no account or API key' | Set-Content -LiteralPath $file -Encoding ascii
            $before[$relative] = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
          }
          $p = Start-Process -FilePath $installer -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Same-directory upgrade failed: $($p.ExitCode)" }
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Upgraded executable missing' }
          foreach ($relative in $fixtures) {
            if ((Get-FileHash -LiteralPath (Join-Path $data $relative) -Algorithm SHA256).Hash -ne $before[$relative]) { throw 'Upgrade changed retained fixture data' }
          }
          $uninstallers = @(Get-ChildItem -LiteralPath $target -Filter '*Uninstall*.exe' -File)
          if ($uninstallers.Count -ne 1) { throw 'Uninstaller identity is ambiguous' }
          $p = Start-Process -FilePath $uninstallers[0].FullName -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent uninstall failed: $($p.ExitCode)" }
          if (Test-Path -LiteralPath $exe) { throw 'Application executable remains after uninstall' }
          foreach ($relative in $fixtures) {
            if ((Get-FileHash -LiteralPath (Join-Path $data $relative) -Algorithm SHA256).Hash -ne $before[$relative]) { throw 'Uninstall changed retained fixture data' }
          }
          if ((Get-FileHash -LiteralPath $env:SHARED_PYTHON -Algorithm SHA256).Hash -ne $sharedHash) { throw 'Shared Python changed' }
          @{version='${{ inputs.version }}';sourceCommit=$receipt.sourceCommit;installerSha256=$sha;defaultNonSystemPathPassed=$true;sameDirectoryUpgradePreservesData=$true;silentUninstallPreservesData=$true;sharedPythonUnchanged=$true;usesSyntheticData=$true;brokerOrdersSubmitted=$false} | ConvertTo-Json | Set-Content 'installer-lifecycle-acceptance.json' -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: public-installer-lifecycle-${{ github.run_id }}
          path: installer-lifecycle-acceptance.json
          if-no-files-found: error
  native_probe:
    if: github.repository == 'hzqedison/RT-ResearchFlow' && inputs.target == 'probe'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute only the production default-selector native calls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'D:\rt-native-defaults-' + $env:GITHUB_RUN_ID
          New-Item -ItemType Directory -Path $root | Out-Null
          $env:TEMP = $root
          $env:TMP = $root
          node scripts/native-nsis-defaults-probe.cjs $root
          if ($LASTEXITCODE -ne 0) { throw 'Native probe generation failed' }
          Invoke-WebRequest 'https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-3.0.4.1/nsis-3.0.4.1.7z' -OutFile "$root\nsis.7z"
          7z x "$root\nsis.7z" "-o$root\compiler" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed' }
          $compiler = @(Get-ChildItem -LiteralPath "$root\compiler" -Filter makensis.exe -File -Recurse)
          $compiler = @($compiler | Where-Object { $_.Directory.Name -eq 'Bin' })
          if ($compiler.Count -ne 1) { throw 'NSIS compiler identity ambiguous' }
          & $compiler[0].FullName /V2 "$root\native-defaults.nsi"
          if ($LASTEXITCODE -ne 0) { throw 'Native probe compilation failed' }
          $p = Start-Process -FilePath "$root\native-defaults.exe" -WindowStyle Hidden -Wait -PassThru
          Get-Content -LiteralPath "$root\native-defaults.log"
          Write-Output "NATIVE_DEFAULT_SELECTOR_EXIT=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw 'Native default selector failed' }
