name: Public on-demand Mac packages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-on-demand-macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'hzqedison/RT-ResearchFlow'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RT_EXTENSION_DELIVERY: on-demand
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      USE_HARD_LINKS: 'false'
      NODE_OPTIONS: ''
      NODE_PATH: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Install native dependencies
        run: |
          test "$(node -p process.arch)" = '${{ matrix.arch }}'
          pnpm install --frozen-lockfile --config.side-effects-cache=false
      - name: Type checks and extension contracts
        run: |
          pnpm run typecheck
          pnpm exec vitest run tests/unit/onDemandDataExtensions.test.ts tests/unit/pythonSourceRequirements.test.ts tests/unit/dataExtensionDelivery.test.ts
      - name: Build same-product native installer
        run: node macos/build.mjs
      - name: Actual DMG install, startup and first-use online extension test
        shell: bash
        env:
          RT_ONDEMAND_PYTHON: ${{ steps.python.outputs.python-path }}
          RT_ONDEMAND_ALLOW_NETWORK: '1'
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/public-dmg"
          install="$RUNNER_TEMP/public-installed"
          mkdir -p "$mount" "$install"
          dmg="$(find release -maxdepth 1 -name '*-${{ matrix.arch }}.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" || true' EXIT
          ditto "$mount/RT-ResearchFlow.app" "$install/RT-ResearchFlow.app"
          hdiutil detach "$mount"
          trap - EXIT
          codesign --verify --deep --strict "$install/RT-ResearchFlow.app"
          export RT_PACKAGED_EXE="$install/RT-ResearchFlow.app/Contents/MacOS/RT-ResearchFlow"
          export RT_PACKAGED_VERSION="$(node -p 'require("./package.json").version')"
          export RT_PACKAGED_TEST_ROOT="$RUNNER_TEMP/public-acceptance"
          node scripts/mac-packaged-acceptance.cjs "$RT_PACKAGED_EXE"
          pnpm exec playwright test tests/e2e/on-demand-extensions.spec.ts --workers=1 --reporter=line
          shasum -a 256 release/*.dmg > release/SHA256SUMS-${{ matrix.arch }}.txt
      - name: Upload only tested direct installers
        uses: actions/upload-artifact@v4
        with:
          name: public-mac-${{ matrix.arch }}-${{ github.sha }}
          path: |
            release/*.dmg
            release/SHA256SUMS-${{ matrix.arch }}.txt
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-mac-evidence-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: ignore
