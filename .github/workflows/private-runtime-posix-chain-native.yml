name: Native Mac private process chain

on:
  push:
    branches: [codex/verify-1.7, codex/verify-mac-1.7]
    paths:
      - .github/workflows/private-runtime-posix-chain-native.yml
      - tests/native/private-runtime-posix-owned-chain.cjs
      - tests/node/private-runtime-posix-owned-chain.test.cjs
      - scripts/private-runtime-owned-supervisor.cjs
      - scripts/report-private-runtime-native-bootstrap.py
      - resources/python-runtime/bootstrap.py
      - resources/python-runtime/pywencai_adapter.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-posix-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-chain:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            filename: cpython-3.13.16+20261003-aarch64-apple-darwin-install_only.tar.gz
            bytes: 25365830
            sha256: d8975d7df4f08f7b1c7aafcdfacbddcec3d366415f2c1a72b2466b6850815933
          - runner: macos-15-intel
            arch: x64
            filename: cpython-3.13.16+20261003-x86_64-apple-darwin-install_only.tar.gz
            bytes: 25067280
            sha256: 8e9cb087305bfb8969f68a905f79f41469d4aa5220c1aa71ada7fc9953bdba0f
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      RT_PBS_NAME: ${{ matrix.filename }}
      RT_PBS_BYTES: ${{ matrix.bytes }}
      RT_PBS_SHA: ${{ matrix.sha256 }}
      RT_CHAIN_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Prepare exact private interpreter for process-ownership probes
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 -I -B - <<'PY'
          import hashlib, os, pathlib, tarfile, urllib.request
          if os.environ.get("RUNNER_ENVIRONMENT") != "github-hosted":
              raise SystemExit("Disposable hosted runner required")
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rt-posix-owned-chain-inputs"
          root.mkdir()
          name = os.environ["RT_PBS_NAME"]
          url = "https://github.com/astral-sh/python-build-standalone/releases/download/20261003/" + name.replace("+", "%2B")
          expected = int(os.environ["RT_PBS_BYTES"])
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(expected + 1)
          if len(data) != expected or hashlib.sha256(data).hexdigest() != os.environ["RT_PBS_SHA"]:
              raise SystemExit("Pinned PBS bytes mismatch")
          archive = root / "python.tar.gz"
          archive.write_bytes(data)
          with tarfile.open(archive, "r:gz") as source:
              source.extractall(root, filter="data")
          interpreter = (root / "python/bin/python3.13").resolve(strict=True)
          if not interpreter.is_relative_to(root) or not interpreter.is_file():
              raise SystemExit("Private interpreter escaped owned root")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("RT_CHAIN_PYTHON=" + str(interpreter) + "\n")
          PY
      - name: Isolated direct harness contracts
        run: node --test tests/node/private-runtime-posix-owned-chain.test.cjs tests/node/private-runtime-owned-supervisor.test.cjs
      - name: Observe actual two-API process exits on native Mac
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.arch')" = "$RT_CHAIN_ARCH"
          node tests/native/private-runtime-posix-owned-chain.cjs \
            --python "$RT_CHAIN_PYTHON" --cache-root "$RUNNER_TEMP" \
            --out "$RUNNER_TEMP/posix-owned-chain.json"
      - name: Preserve bounded native evidence, not product approval
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: posix-owned-chain-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/posix-owned-chain.json
            ${{ runner.temp }}/rt-posix-owned-chain-*/report.json
            ${{ runner.temp }}/rt-posix-owned-chain-*/case-*/*.json
          if-no-files-found: warn
          retention-days: 7
