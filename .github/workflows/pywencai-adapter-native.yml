name: Private pywencai native regression (no provider requests)

on:
  push:
    branches: [codex/verify-1.7]
    paths:
      - .github/workflows/pywencai-adapter-native.yml
      - scripts/run-pywencai-adapter-ci.py
      - scripts/build-provider-source-wheels.py
      - resources/python-runtime/pywencai_adapter.py
      - tests/python/test_pywencai_bounded_inflate.py
      - tests/python/test_private_pywencai_adapter.py
      - .gitattributes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pywencai-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-regression:
    if: github.repository == 'hzqedison/RT-ResearchFlow'
    name: pywencai-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win32-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Execute pinned private runtimes and synthetic HTTP regressions
        env:
          RT_EXPECTED_TARGET: ${{ matrix.target }}
        run: python scripts/run-pywencai-adapter-ci.py
      - name: Retain candidate-only public CI evidence
        if: always() && env.RT_PYWENCAI_EVIDENCE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pywencai-native-${{ matrix.target }}-${{ github.sha }}
          path: ${{ env.RT_PYWENCAI_EVIDENCE }}/*
          if-no-files-found: error
          retention-days: 7
