name: Mac owner draft package 1.7
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: mac-owner-package-1.7
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'hzqedison/RT-ResearchFlow' && github.actor == 'hzqedison' && github.ref == 'refs/heads/codex/runtime-owner-cache-1.7'
    name: owner-dmg-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
          - target: darwin-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: '3.13'
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.14.0
      - name: Owner guard and exact ordinary runtime assembly/source delivery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node scripts/mac-owner-package-ci.cjs prepare
      - name: Install exact application dependencies
        run: pnpm install --frozen-lockfile --config.side-effects-cache=false
      - name: Build native Mac owner DMG, never publish automatically
        run: node macos/build.mjs
      - name: Verify final copied bytes, signature and actual Electron SQLite ABI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/mac-owner-package-ci.cjs finish
      - name: Verify existing owner draft before and after asset upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/mac-owner-package-ci.cjs publish
      - name: Preserve DMG and exact receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-owner-package-${{ matrix.target }}
          path: |
            release/*.dmg
            release/mac-owner-package-receipt-*.json
            ${{ runner.temp }}/rt-mac-owner-${{ matrix.target }}/ordinary-assembly-receipt.json
            ${{ runner.temp }}/rt-mac-owner-${{ matrix.target }}/source/source-receipt.json
            ${{ runner.temp }}/rt-mac-owner-${{ matrix.target }}/source/SOURCE-ACCESS.txt
          if-no-files-found: warn
          retention-days: 30
