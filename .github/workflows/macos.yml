name: Product-private Python native acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-python:
    name: Native Python ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      USE_HARD_LINKS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - name: Install test dependencies without application setup hooks
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the native Electron test host
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
        run: node node_modules/electron/install.js
      - name: Verify archive contracts and main-process types
        run: |
          pnpm exec vitest run tests/unit/productPythonDownloads.test.ts tests/unit/macProductPythonRuntime.test.ts
          pnpm exec tsc --noEmit -p tsconfig.node.json --composite false
      - name: Compile isolated native smoke harness
        run: pnpm exec esbuild tests/native/productPythonSmoke.ts --bundle --platform=node --format=cjs --external:electron --outfile="$RUNNER_TEMP/product-private-python-smoke.cjs"
      - name: Accept actual Python download, relocation and AkShare installation
        env:
          RT_EXPECTED_ARCH: ${{ matrix.arch }}
          RT_PRODUCT_PYTHON_TEST_ROOT: ${{ runner.temp }}/product-private-python
          RT_PRODUCT_PYTHON_RECEIPT: ${{ runner.temp }}/product-private-python-acceptance.json
        run: pnpm exec electron "$RUNNER_TEMP/product-private-python-smoke.cjs"
      - name: Upload the bounded native acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-private-python-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/product-private-python-acceptance.json
          if-no-files-found: warn

# This workflow publishes no installers and never accesses production user data.
