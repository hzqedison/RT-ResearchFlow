name: Collect reviewed private runtime license materials
on:
  workflow_dispatch:
  push:
    branches:
      - codex/reviewed-materials-1.7
    paths:
      - .github/workflows/runtime-license-materials.yml
      - resources/python-runtime/reviewed-materials/**
permissions:
  contents: read
concurrency:
  group: reviewed-runtime-materials-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reviewed-materials:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Collect exact reviewed public materials without source execution
        shell: bash
        run: >-
          python -X utf8 -I -B resources/python-runtime/reviewed-materials/fetch-runtime-license-materials-ci.py
          --output-dir "$RUNNER_TEMP/runtime-reviewed-public-materials"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-reviewed-public-materials
          path: ${{ runner.temp }}/runtime-reviewed-public-materials
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
