name: Private Node JS backend native semantic checks
on:
  workflow_dispatch:
  push:
    branches:
      - codex/private-node-js-native-1.7
    paths:
      - .github/workflows/private-node-js-native.yml
      - scripts/private-node-js-runtime/**
      - scripts/build-private-node-js-runtime-wheel.py
      - tests/python/test_private_node_js_runtime.py
permissions:
  contents: read
concurrency:
  group: private-node-js-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-semantics:
    name: node-js-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-latest
            architecture: x64
          - target: darwin-arm64
            runner: macos-15
            architecture: arm64
          - target: darwin-x64
            runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - name: Create disposable hosted Windows fixture parent
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Disposable hosted runner required'
          }
          [IO.Directory]::CreateDirectory('D:\RT-ResearchFlow-BuildCache') | Out-Null
      - name: Run real native Node semantics without provider or broker requests
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 -I -B -c 'import os,pathlib,subprocess,sys; root=pathlib.Path(os.environ["RUNNER_TEMP"]).resolve(strict=True); evidence=root/"private-node-js-native-evidence"; evidence.mkdir(); node=subprocess.check_output(["node","-p","process.execPath"],text=True).strip(); raise SystemExit(subprocess.call([sys.executable,"-X","utf8","-B","tests/python/test_private_node_js_runtime.py","--private-node",node,"--evidence-output",str(evidence/"evidence.json")]))'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: private-node-js-native-${{ matrix.target }}
          path: ${{ runner.temp }}/private-node-js-native-evidence
          if-no-files-found: error
          retention-days: 30
