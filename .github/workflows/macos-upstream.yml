name: Check upstream for Mac fork

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: macos-upstream-sync
  cancel-in-progress: false

jobs:
  propose-update:
    if: github.repository != 'caoritian002-wq/RT-ResearchFlow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Merge upstream on a new branch and propose it for review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/caoritian002-wq/RT-ResearchFlow.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'No upstream updates.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sha="$(git rev-parse upstream/main)"
          branch="codex/upstream-${sha:0:12}"
          if test -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state all --json number --jq '.[0].number // empty')"; then
            echo "An update PR already exists for $sha." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
            echo "Branch $branch already exists; inspect it manually. No branch was overwritten." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git switch -c "$branch"
          if ! git merge --no-edit upstream/main; then
            echo 'Upstream merge has conflicts. Merge manually on codex/macos-support; no personal branch was overwritten.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          gh auth setup-git
          git push origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Sync upstream ${sha:0:12}" \
            --body "Merge upstream commit $sha while preserving the Mac adaptation. Review changes and the dispatched macOS/Windows checks before merging. No force push or automatic conflict resolution is used."
          # GITHUB_TOKEN-created PRs do not trigger normal PR workflows.
          # Explicit dispatches test this exact update branch without a PAT.
          gh workflow run macos.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run verify.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
